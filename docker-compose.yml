services:
  db:
    image: postgres:16-alpine
    container_name: booknest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booknest
      POSTGRES_PASSWORD: booknest_password
      POSTGRES_DB: booknest
    ports:
      - "5432:5432"
    volumes:
      - booknest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest -d booknest"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: booknest-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://booknest:booknest_password@db:5432/booknest?schema=public
      JWT_SECRET: change-this-to-a-secure-production-secret
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: booknest-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  booknest_postgres_data: